<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrushBridge — Painting jobs across Switzerland, Germany, France &amp; Italy</title>
<meta name="description" content="London-based outsourcing company placing painters and decorators (Maler, peintres, imbianchini) with agencies in all 26 Swiss cantons, Germany, France and Italy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  BrushBridge — single-file site template.
  NOTE: company details, testimonials, reviews, team members and jobs are SAMPLE CONTENT.
  Replace them with real data before going live. Forms store submissions in the browser (localStorage) only.
-->
<style>
:root{
  --blue:#0071bb;--blue-d:#005c99;--blue-l:#eaf3fa;
  --green:#3a8a61;--green-bg:#f3f8ef;
  --gray:#f5f5f7;--line:#e5e7eb;--line-2:#cfd4dc;
  --ink:#0b0b0b;--muted:#565c66;--red:#d24242;--err:#c62828;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:6rem}
body{margin:0;background:#fff;color:var(--ink);font:400 1.125rem/1.55 var(--font);overflow-x:hidden}
body.lock{overflow:hidden}
@media (max-width:48rem){body{font-size:1rem}}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,h4{font-weight:600;line-height:1.18;margin:0 0 .6em;letter-spacing:-.012em}
h1{font-size:clamp(2rem,4vw,3rem)}
h2{font-size:clamp(1.65rem,3vw,2.25rem)}
h3{font-size:clamp(1.2rem,2vw,1.55rem)}
p{margin:0 0 1em}
ul,ol{margin:0;padding:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.skip{position:absolute;left:-999rem;top:.5rem;z-index:100;background:var(--blue);color:#fff;padding:.6rem 1rem;border-radius:.3rem}
.skip:focus{left:1rem}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{outline:none;min-height:60vh}
.wrap{width:100%;max-width:80rem;margin:0 auto;padding:0 1.5rem}
@media (max-width:40rem){.wrap{padding:0 1rem}}
.narrow{max-width:56rem}
.sec{padding:5rem 0}
.sec-s{padding:3rem 0}
@media (max-width:48rem){.sec{padding:3.5rem 0}.sec-s{padding:2.25rem 0}}
.gray{background:var(--gray)}
.greenbg{background:var(--green-bg)}
.green{color:var(--green)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.center{text-align:center}
.lead{font-size:1.2rem;color:var(--muted);max-width:46rem}
.big{font-size:clamp(2rem,4.2vw,3.1rem);max-width:58rem;margin-bottom:2.5rem}

/* links & buttons */
.more{display:inline-flex;align-items:center;gap:.8rem;color:var(--blue);font-weight:500;text-decoration:none;line-height:1.3}
.more .la{width:3rem;height:.75rem;flex:none;transition:transform .2s}
.more:hover .la{transform:translateX(.35rem)}
.la{display:block}
.links{display:grid;gap:.7rem;margin-top:1.5rem;justify-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:600 1rem/1.1 var(--font);padding:.9rem 1.6rem;border-radius:.375rem;border:2px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn svg{width:1.1rem;height:1.1rem}
.btn-o{background:#fff;color:var(--blue)}
.btn-o:hover{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}
.btn-w{background:transparent;border-color:#fff;color:#fff}
.btn-w:hover{background:#fff;color:var(--blue);border-color:#fff}
.btn-g{background:var(--gray);border-color:var(--gray);color:var(--ink)}
.btn-g:hover{background:var(--line);border-color:var(--line)}
.btn-sm{padding:.6rem 1rem;font-size:.9rem}
.btn-block{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:.75rem}

/* header */
.hd{position:sticky;top:0;z-index:60;background:#fff;transition:box-shadow .2s}
.hd.scrolled{box-shadow:0 1px 0 var(--line)}
.hd-in{display:flex;align-items:center;gap:2rem;height:5.5rem}
.logo{display:inline-flex;flex-direction:column;text-decoration:none;color:var(--blue);font-weight:700;font-size:1.9rem;line-height:.8;letter-spacing:-.05em;flex:none}
.logo span:last-child{padding-left:1.05em}
.logo.w{color:#fff}
.logo.xl{font-size:clamp(3.5rem,8vw,6rem)}
.mainnav{margin:0 auto}
.mainnav>ul{list-style:none;display:flex;gap:2.5rem}
.nb{background:none;border:0;border-bottom:2px solid transparent;font:500 1.05rem/1 var(--font);color:var(--ink);cursor:pointer;padding:.6rem 0}
.nb:hover,.nb[aria-expanded="true"],.nb.cur{color:var(--blue);border-color:var(--blue)}
.util{display:flex;align-items:center;gap:1.4rem;font-size:.92rem;margin-left:auto}
.mainnav+.util{margin-left:0}
.u{display:inline-flex;align-items:center;gap:.35rem;text-decoration:none;background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;position:relative;padding:.3rem 0}
.u:hover{color:var(--blue)}
.u svg{width:1.15rem;height:1.15rem}
.badge{position:absolute;top:-.45rem;right:-.75rem;min-width:1.15rem;height:1.15rem;padding:0 .3rem;border-radius:1rem;background:var(--red);color:#fff;font-size:.68rem;font-weight:600;display:grid;place-items:center;line-height:1}
.langsel{position:relative}
.langsel ul{list-style:none;position:absolute;right:0;top:calc(100% + .5rem);display:none;background:#fff;border:1px solid var(--line);border-radius:.5rem;padding:.35rem;min-width:9.5rem;box-shadow:0 .75rem 2rem rgba(0,0,0,.1)}
.langsel.open ul{display:block}
.langsel li button{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;padding:.55rem .75rem;border-radius:.3rem;cursor:pointer}
.langsel li button:hover,.langsel li button[aria-current="true"]{background:var(--blue-l);color:var(--blue)}
.burger{display:none}
@media (max-width:66rem){.mainnav,.u .u-txt{display:none}.burger{display:inline-flex}.util{gap:1.2rem}}
.mega{position:absolute;left:0;right:0;top:100%;background:#fff;border-top:1px solid var(--line);box-shadow:0 2rem 2.5rem -1.5rem rgba(0,0,0,.18);padding:2.75rem 0 3.25rem}
.mega[hidden]{display:none}
.mega-grid{display:grid;grid-template-columns:1.2fr 1.2fr 21rem;gap:1rem 3rem;align-items:start}
.mega h3{grid-column:1/3;font-size:1.6rem;margin:0 0 .5rem}
.mega-links{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;gap:1rem 3rem}
.mega-links a{display:flex;justify-content:space-between;align-items:center;gap:1rem;color:var(--blue);text-decoration:none;font-size:1.15rem;font-weight:500;padding:.6rem 0;border-bottom:1px solid var(--line)}
.mega-links a .la{width:2.75rem}
.mega-links a:hover .la{transform:translateX(.3rem)}
.mega-links a[aria-current="page"]{color:var(--ink)}
.teaser{grid-column:3;grid-row:1/3;display:grid;gap:.75rem;text-decoration:none}
.teaser img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:.75rem;background:var(--gray)}
.teaser b{font-size:1.1rem;font-weight:600}
.drawer{position:fixed;inset:5.5rem 0 0 0;z-index:59;background:#fff;overflow:auto;padding:1rem 0 4rem;border-top:1px solid var(--line)}
.drawer[hidden]{display:none}
.drawer h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:1.75rem 0 .25rem}
.drawer a.dl{display:flex;justify-content:space-between;align-items:center;padding:.85rem 0;border-bottom:1px solid var(--line);color:var(--blue);text-decoration:none;font-size:1.15rem;font-weight:500}
.drawer .la{width:2.5rem}
.drawer .dlang{display:flex;gap:.5rem;margin-top:1.5rem}
.drawer .dlang button{flex:1;padding:.7rem;border:1px solid var(--line);background:#fff;border-radius:.3rem;font:600 .9rem var(--font);cursor:pointer}
.drawer .dlang button[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

/* side tabs */
.side{position:fixed;right:0;top:42%;z-index:55;display:flex;flex-direction:column;gap:.4rem}
.st{display:flex;flex-direction:column;align-items:center;gap:.35rem;width:6.25rem;padding:.8rem .6rem;font:600 .8rem/1.2 var(--font);text-align:center;text-decoration:none;border-radius:.5rem 0 0 .5rem;background:#fff;color:var(--blue);box-shadow:0 .25rem 1.25rem rgba(0,0,0,.12)}
.st.b{background:var(--blue);color:#fff}
.st svg{width:1.15rem;height:1.15rem}
@media (max-width:48rem){.side{top:auto;bottom:6rem}.st{width:auto;writing-mode:vertical-rl;transform:rotate(180deg);border-radius:0 .5rem .5rem 0;padding:1rem .55rem;font-size:.85rem}.st svg{display:none}}

/* home hero */
.hero{padding:0 .75rem}
.hero-box{position:relative;border-radius:2rem;overflow:hidden;height:clamp(30rem,74vh,44rem);background:#2a2d31;color:#fff}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.slide.on{opacity:1}
.slide>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.3) 50%,rgba(0,0,0,.05) 85%)}
.hero-txt{position:absolute;inset:0 0 9rem 0;z-index:2;display:flex;align-items:center}
.bars{display:flex;gap:1.25rem;margin-bottom:2.25rem}
.bars button{position:relative;width:clamp(3.5rem,8vw,6.75rem);height:.25rem;padding:0;border:0;background:rgba(255,255,255,.38);cursor:pointer;overflow:hidden}
.bars button::before{content:"";position:absolute;inset:-.75rem 0}
.bars i{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.bars button.done i{transform:none}
.bars button.on i{animation:bar 7s linear forwards}
.hero-box:hover .bars button.on i,.hero-box:focus-within .bars button.on i{animation-play-state:paused}
@keyframes bar{to{transform:scaleX(1)}}
.hero-title{font-size:clamp(2.1rem,4.6vw,3.5rem);font-weight:600;line-height:1.12;letter-spacing:-.015em;max-width:38rem;margin:0 0 1.5rem}
.hero-box .more{color:#fff;font-size:1.15rem}
.finder{position:relative;z-index:3;margin:-8.5rem auto 0;max-width:70rem;background:#fff;border-radius:1.5rem;padding:2.75rem 3.25rem 3rem;box-shadow:0 .75rem 3rem rgba(0,0,0,.08)}
.finder form{display:flex;gap:.75rem}
.finder input{flex:1;min-width:0;border:2px solid var(--blue);border-radius:.3rem;padding:.85rem 1.1rem;font:inherit;font-size:1.1rem;color:var(--ink)}
.finder input::placeholder{color:var(--blue);opacity:.85}
.finder input:focus{outline:none;box-shadow:0 0 0 3px var(--blue-l)}
.finder form button{flex:none;width:4.25rem;border:0;border-radius:.3rem;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer}
.finder form button:hover{background:var(--blue-d)}
.finder form button svg{width:1.5rem;height:1.5rem}
.ql-t{font-size:1.3rem;margin:2.25rem 0 1.1rem}
.ql{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem 2.5rem}
@media (max-width:52rem){.ql{grid-template-columns:1fr 1fr}}
@media (max-width:40rem){.finder{margin-top:-5rem;padding:1.75rem 1.25rem 2rem;border-radius:1.25rem}.ql{grid-template-columns:1fr}.hero-txt{inset:0 0 5rem 0}.hero-box{border-radius:1.5rem}}

/* intro */
.intro{display:grid;grid-template-columns:1fr 1.25fr;gap:3rem 5rem;align-items:center}
.intro-mark{display:grid;justify-items:center;gap:1rem;padding:2rem}
.intro-mark>.cap{color:var(--muted);font-size:.95rem;letter-spacing:.04em}
@media (max-width:52rem){.intro{grid-template-columns:1fr}.intro-mark{justify-items:start;padding:0}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;margin-top:4rem;border-top:1px solid var(--line);padding-top:2.5rem}
.kpis b{display:block;font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:600;color:var(--blue);line-height:1.1}
.kpis span{color:var(--muted);font-size:.95rem}
@media (max-width:48rem){.kpis{grid-template-columns:1fr 1fr}}

/* news cards */
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr));gap:2.5rem 1.75rem;margin:2rem 0 3rem}
.nc{display:flex;flex-direction:column;gap:.65rem;text-decoration:none}
.nc .ph{position:relative;border-radius:.75rem;overflow:hidden;background:var(--gray);aspect-ratio:16/9.5;margin-bottom:.35rem}
.nc .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.nc:hover .ph img{transform:scale(1.04)}
.tag{align-self:flex-start;display:inline-block;background:var(--gray);font-size:.82rem;font-weight:500;padding:.3rem .65rem;border-radius:.25rem;color:var(--ink)}
.ph .tag{position:absolute;left:.75rem;bottom:.75rem;background:#fff}
.nc .date{font-size:.9rem;color:var(--muted)}
.nc h3{font-size:1.35rem;margin:0}
.nc .more{margin-top:.25rem}
.nc p{margin:0;color:var(--muted);font-size:1rem}

/* feature rows */
.feat{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem 5rem;align-items:center;padding:2.5rem 0}
.feat+.feat{border-top:1px solid var(--line)}
.gray .feat+.feat,.greenbg .feat+.feat{border-color:rgba(0,0,0,.07)}
.feat-img img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:1rem;background:var(--line)}
.feat.rev .feat-img{order:2}
.feat p{color:var(--muted)}
@media (max-width:52rem){.feat{grid-template-columns:1fr;gap:1.5rem}.feat.rev .feat-img{order:0}}

/* columns */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15.5rem),1fr));gap:2.75rem 2.25rem;margin-top:2rem}
.col{border-top:2px solid var(--blue);padding-top:1.25rem}
.col h3{font-size:1.25rem;display:flex;align-items:center;gap:.6rem}
.col p{color:var(--muted);font-size:1rem}
.greenbg .col{border-color:var(--green)}
.clist{list-style:none;display:grid;gap:.35rem;margin:0 0 1.25rem}
.clist a{color:var(--blue);text-decoration:none}
.clist a:hover{text-decoration:underline}
.two{display:grid;grid-template-columns:1fr 1fr;gap:3rem 5rem}
@media (max-width:52rem){.two{grid-template-columns:1fr}}
.steps{list-style:none;display:grid;gap:1.6rem;margin:2rem 0 2.25rem}
.steps li{display:grid;grid-template-columns:3.25rem 1fr;gap:1rem}
.num{font-size:2.4rem;font-weight:600;color:var(--blue);line-height:1}
.steps h3{font-size:1.2rem;margin:.3rem 0 .3rem}
.steps p{margin:0;color:var(--muted);font-size:1rem}
.check{list-style:none;display:grid;gap:.85rem;margin:1.5rem 0 2rem}
.check li{display:grid;grid-template-columns:1.4rem 1fr;gap:.75rem}
.check svg{width:1.4rem;height:1.4rem;color:var(--blue);margin-top:.1rem}
.tlist{border-top:1px solid var(--line);margin-top:2rem}
.trow{display:grid;grid-template-columns:1fr auto 3rem;gap:1.5rem;align-items:center;padding:1.15rem 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:1.2rem;font-weight:500}
.trow:hover{color:var(--blue)}
.trow .la{width:3rem;color:var(--blue)}
.trow .muted{font-size:.95rem;font-weight:400}

/* quotes */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:3rem 4rem;margin:2.5rem 0}
.quote{margin:0;border-left:3px solid var(--blue);padding:.15rem 0 .15rem 1.6rem}
.quote blockquote{margin:0 0 1.1rem;font-size:1.25rem;line-height:1.5}
.quote figcaption b{display:block;font-weight:600}
.quote figcaption span{color:var(--muted);font-size:.95rem}
.quote .lg{display:inline-block;margin-left:.4rem;font-size:.72rem;font-weight:600;letter-spacing:.06em;border:1px solid var(--line-2);border-radius:.2rem;padding:.05rem .3rem;color:var(--muted)}

/* banner */
.banner{background:var(--blue);color:#fff;border-radius:1rem;padding:3rem 3.5rem;display:grid;grid-template-columns:1.5fr 1fr;gap:2rem 3rem;align-items:center}
.banner ul{list-style:none;display:grid;gap:.4rem;font-size:clamp(1.35rem,2.6vw,2rem);font-weight:600;line-height:1.25}
.banner-r{display:grid;gap:1.5rem;justify-items:end}
@media (max-width:52rem){.banner{grid-template-columns:1fr;padding:2rem 1.5rem}.banner-r{justify-items:start}}

/* page hero */
.phero{padding:0 .75rem}
.phero-in{position:relative;border-radius:2rem;overflow:hidden;min-height:clamp(17rem,42vh,26rem);display:flex;align-items:flex-end;background:#2a2d31;color:#fff}
.phero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phero-in::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.66) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.08) 100%)}
.phero-txt{position:relative;z-index:1;width:100%;padding:3rem 0 3.25rem}
.phero h1{color:#fff;margin:0;max-width:54rem}
.phero p{max-width:48rem;margin:.9rem 0 0;font-size:1.15rem;color:rgba(255,255,255,.92)}
.crumbs{font-size:.88rem;margin-bottom:.85rem;color:rgba(255,255,255,.85)}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
@media (max-width:40rem){.phero-in{border-radius:1.5rem}}
.facts-row{display:flex;flex-wrap:wrap;gap:1rem 3rem;margin-top:1.75rem}
.facts-row div b{display:block;font-size:1.5rem;font-weight:600}
.facts-row div span{font-size:.88rem;color:rgba(255,255,255,.85)}

/* tabs */
.utabs{display:flex;gap:2.25rem;border-bottom:1px solid var(--line);margin-bottom:2.25rem;overflow-x:auto;scrollbar-width:none}
.utabs::-webkit-scrollbar{display:none}
.utabs button{display:flex;align-items:center;gap:.55rem;background:none;border:0;border-bottom:2px solid transparent;padding:.8rem 0;margin-bottom:-1px;font:500 1.08rem/1 var(--font);color:var(--ink);cursor:pointer;white-space:nowrap}
.utabs button:hover{color:var(--blue)}
.utabs button[aria-selected="true"]{color:var(--blue);border-color:var(--blue)}
.utabs .n{font-size:.8rem;color:var(--muted)}
.flag{width:1.25rem;height:1.25rem;border-radius:.2rem;flex:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:.375rem;overflow:hidden}
.seg button{background:#fff;border:0;padding:.6rem 1rem;font:600 .9rem var(--font);cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* job rows */
.jlist{border-top:1px solid var(--line)}
.jrow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto 7.5rem 2.75rem;gap:1.5rem;align-items:center;padding:1.3rem .75rem;border-bottom:1px solid var(--line);transition:background .15s}
.jrow:hover{background:var(--gray)}
.jrow h3{font-size:1.15rem;margin:0 0 .25rem;font-weight:600}
.jrow h3 a{text-decoration:none}
.jrow h3 a::after{content:"";position:absolute;inset:0}
.jrow:hover h3{color:var(--blue)}
.jr-m{margin:0;color:var(--muted);font-size:.95rem;display:flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:center}
.jr-m .flag{width:1rem;height:1rem}
.jr-tags{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.pill-t{font-size:.78rem;font-weight:600;padding:.3rem .55rem;border-radius:.25rem;background:var(--gray);white-space:nowrap}
.jrow:hover .pill-t{background:#fff}
.pill-t.u{background:#fdeceb;color:#b3261e}
.pill-t.h{background:var(--green-bg);color:var(--green)}
.jr-rate{font-weight:600;white-space:nowrap;text-align:right}
.jr-rate small{font-weight:400;color:var(--muted)}
.save{position:relative;z-index:1;width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.save svg{width:1.15rem;height:1.15rem}
.save:hover{border-color:var(--blue);color:var(--blue)}
.save.on{color:var(--red);border-color:var(--red)}
.save.on svg path{fill:currentColor}
@media (max-width:48rem){.jrow{grid-template-columns:minmax(0,1fr) 2.6rem;gap:.6rem 1rem;padding:1.1rem .25rem}.jr-tags{grid-column:1;grid-row:2;justify-content:flex-start}.jr-rate{grid-column:1;grid-row:3;text-align:left}.save{grid-column:2;grid-row:1}}
.jobs-layout{display:grid;grid-template-columns:18rem minmax(0,1fr);gap:3rem;align-items:start}
.filters{display:grid;gap:1.15rem;position:sticky;top:7rem;background:var(--gray);border-radius:1rem;padding:1.5rem}
@media (max-width:62rem){.jobs-layout{grid-template-columns:1fr;gap:2rem}.filters{position:static}}

.pill span{display:inline-block;padding:.55rem .9rem;border:1px solid var(--line-2);border-radius:.3rem;font-size:.95rem;background:#fff}
.pill input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.pill input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.search-box{position:relative}
.search-box svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:1.1rem;height:1.1rem;color:var(--blue);pointer-events:none}

.form-card{background:#fff;border:1px solid var(--line);border-radius:1rem;padding:2.5rem}
@media (max-width:40rem){.form-card{padding:1.5rem 1.15rem}}
.stepper{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:2.5rem}

.stepper li::before{content:"";height:.25rem;background:var(--line)}
.stepper li.active,.stepper li.done{color:var(--ink)}
.stepper li.active::before,.stepper li.done::before{background:var(--blue)}
.stepper b{color:var(--blue);margin-right:.25rem}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset[hidden]{display:none}
.form-nav{display:flex;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.form-nav .sp{flex:1}
.summary{margin:0 0 1.5rem;display:grid;border-top:1px solid var(--line)}
.summary div{display:grid;grid-template-columns:minmax(8rem,36%) 1fr;gap:1rem;padding:.65rem 0;border-bottom:1px solid var(--line);font-size:.98rem}

.summary dd{margin:0;font-weight:500;word-break:break-word}
.success{text-align:center;padding:1.5rem 0}

.success .ok svg{width:2rem;height:2rem}

.loc-top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem 2rem;flex-wrap:wrap;margin-bottom:2rem}
.loc-top .utabs{margin:0;flex:1;min-width:0}
.loc-top .search-box{width:20rem;max-width:100%}
.ch-layout{display:grid;grid-template-columns:minmax(0,25rem) minmax(0,1fr);gap:3rem;align-items:start}
@media (max-width:62rem){.ch-layout{grid-template-columns:minmax(0,1fr)}}
.map-card{background:var(--gray);border-radius:1rem;padding:1.75rem;position:sticky;top:7rem}

.map-card h2{font-size:1.3rem;margin-bottom:.3rem}
.tile-map{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:.3rem;margin-top:1.25rem}
.tile{aspect-ratio:1;border:0;border-radius:.3rem;font:700 clamp(.55rem,1.4vw,.72rem)/1 var(--font);cursor:pointer;color:var(--blue);background:color-mix(in srgb,var(--blue) calc(var(--heat) * 75% + 10%),#fff);transition:transform .15s}
.tile.hi{color:#fff}
.tile:hover{transform:scale(1.1)}
.tile.sel{outline:2px solid var(--ink);outline-offset:1px}

.canton-list>.btn{grid-column:1/-1;justify-self:start}
.canton{border-top:2px solid var(--blue);padding-top:1rem}
.canton h3{font-size:1.1rem;display:flex;gap:.6rem;align-items:baseline;margin-bottom:.6rem}
.canton h3 span{font-size:.78rem;color:var(--blue);font-weight:700}
.canton ul{list-style:none}
.cl{display:flex;justify-content:space-between;gap:1rem;padding:.45rem 0;border-bottom:1px solid var(--line);color:var(--blue);text-decoration:none;font-size:1rem}
.cl:hover{color:var(--blue-d);text-decoration:underline}
.cl span{color:var(--muted);font-size:.85rem;text-decoration:none}
.city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16rem),1fr));gap:0 2.25rem}

/* pricing */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:1.5rem;align-items:stretch}

.price{font-size:2.6rem;font-weight:600;line-height:1;margin:.5rem 0}
.price small{font-size:.95rem;font-weight:400;color:var(--muted);margin-left:.35rem}
.plan .check{margin:0 0 auto;font-size:1rem}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}

.range-row{display:grid;gap:.4rem}
.range-row label{display:flex;justify-content:space-between;font-weight:600;font-size:.98rem}

input[type="range"]{width:100%;accent-color:var(--blue)}

.calc-out div{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 0;border-bottom:1px solid rgba(255,255,255,.25)}
.calc-out div:last-child{border:0;font-size:1.5rem;font-weight:600}

.job-detail{display:grid;grid-template-columns:minmax(0,1fr) 22rem;gap:3.5rem;align-items:start}

.job-detail h2{font-size:1.45rem}
.job-detail section+section{border-top:1px solid var(--line);padding-top:2rem;margin-top:2rem}
.aside{background:var(--gray);border-radius:1rem;padding:1.75rem;position:sticky;top:7rem}

.aside .rate small{font-size:1rem;font-weight:400;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem 1rem;margin:0 0 1.75rem}
.facts dt{font-size:.8rem;color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-size:1rem}

@media (max-width:62rem){.rv-layout{grid-template-columns:1fr}}

@media (max-width:62rem){.rv-side{position:static}}

.score b{font-size:3.5rem;font-weight:600;line-height:1}
.rbars{display:grid;gap:.4rem;margin-top:1.25rem}
.rbar{display:grid;grid-template-columns:2.5rem 1fr 2rem;gap:.6rem;align-items:center;background:none;border:0;padding:0;font:inherit;font-size:.88rem;color:var(--muted);cursor:pointer;text-align:left}

.stars .off{color:var(--line-2)}

.rv-h .d{margin-left:auto;font-size:.85rem;color:var(--muted)}

.modal{position:relative;width:100%;max-width:38rem;max-height:calc(100vh - 2rem);overflow:auto;background:#fff;border-radius:1.25rem;padding:2.25rem 2rem 2rem}

.cookie{position:fixed;z-index:85;left:50%;top:50%;transform:translate(-50%,-50%);width:min(32rem,calc(100% - 2rem));background:#fff;border-radius:.75rem;padding:1.75rem;box-shadow:0 1rem 4rem rgba(0,0,0,.25)}
.cookie-bg{position:fixed;inset:0;z-index:84;background:rgba(0,0,0,.25)}
.cookie h2{font-size:1.15rem;margin-bottom:.5rem}
.cookie p{font-size:.95rem;color:var(--muted)}
.cookie .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.cookie .btn-row .btn:first-child{grid-column:1/-1}

@media (max-width:40rem){.ft-in{grid-template-columns:1fr}}

.ft-brand b{display:block;margin-bottom:.75rem}
.ft h4{font-size:1rem;font-weight:600;margin:0 0 1rem}
.ft ul{list-style:none;display:grid;gap:.5rem;font-size:.95rem}
.social{display:flex;gap:1rem;margin-bottom:1.5rem}
.social svg{width:1.5rem;height:1.5rem}
.ft-news{background:rgba(255,255,255,.12);border-radius:.75rem;padding:1.6rem}
.ft-news p{font-size:.98rem}
.ft-news form{display:flex;gap:.5rem}
.ft-news input{flex:1;min-width:0;border:0;border-radius:.3rem;padding:.75rem .9rem;font:inherit;font-size:.95rem}
.ft-news button{border:0;border-radius:.3rem;background:var(--blue-d);color:#fff;font:600 .95rem var(--font);padding:0 1.1rem;cursor:pointer}
.ft-news button:hover{background:#004a7c}
.ftb{background:#fff;font-size:.88rem}
.ftb-in{display:flex;justify-content:space-between;align-items:center;gap:.75rem 2rem;flex-wrap:wrap;padding:1.1rem 0}
.ftb nav{display:flex;flex-wrap:wrap;gap:.25rem 1rem;align-items:center}
.ftb a,.ftb button{color:var(--blue);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:0}
.ftb a:hover{text-decoration:underline}
.ftb button[aria-current="true"]{color:var(--ink);font-weight:600}
.ftb .sep{color:var(--line-2)}
.nf{text-align:center}
.nf .phero-in{min-height:clamp(24rem,60vh,36rem);align-items:center;justify-content:center}

  ab_t:"About BrushBridge", ab_s:"A small London team with paint under its fingernails.",
  ab_story_t:"Our story",
  ab_story:["BrushBridge started in 2019 when our founder — a former site manager on Swiss hotel refurbishments — kept seeing the same problem: agencies in Zurich and St. Gallen couldn’t find painters, while skilled painters across Europe couldn’t find trustworthy work abroad.","So we built a bridge. From our office in London we recruit, screen and place painters with agencies and contractors in Switzerland, Germany, France and Italy, handling the contracts, notifications and pay that make cross-border work feel simple.","Today our multilingual team works with hundreds of partner companies — and we still call every reference ourselves."],
  ab_val_t:"What we stand for",
  ab_vals:[["Fair pay","Collective agreements are the floor, never the ceiling."],["Straight talk","Rates, dates and conditions in writing before anyone travels."],["Craft first","We place tradespeople, not headcount."],["Always reachable","A real person answers — in your language."]],
  ab_team_t:"The team",
  team:[["Elena Marchetti","Co-founder & CEO"],["Jonas Keller","Head of Swiss placements"],["Camille Rousseau","Partnerships, France & Romandie"],["Daniel Okafor","Compliance & payroll"],["Giulia Rossi","Recruiter, Italy & Ticino"],["Piotr Zieliński","Recruiter, Germany & Eastern Switzerland"]],
  ab_office_t:"Visit us in London", city_london:"London, United Kingdom",
  faq_t:"Frequently asked questions", faq_s:"Can’t find your answer? Write to us — we reply within one working day.", faq_search:"Search questions…",
  faqs:[["Is BrushBridge free for painters?","Yes. The Basic plan is free forever. Our fee is paid by the agency or contractor that hires you. Pro is optional."],["Do I need a Swiss work permit?","EU/EFTA citizens can usually work in Switzerland for up to 90 days per calendar year using the online notification procedure; longer assignments need a permit. We explain your options during the screening call."],["How and when am I paid?","Approved hours are paid every Friday by bank transfer in CHF or EUR, depending on the country of the assignment."],["What rates can I expect?","Rates depend on country, canton, trade and experience. Every job on our board shows the hourly rate, and we never accept offers below the applicable collective agreement."],["Do you help with accommodation?","Yes. For assignments away from home we help you find first-week housing and share trusted long-stay options."],["Which languages do I need?","German for most of Switzerland and Germany, French for Romandie and France, Italian for Ticino and Italy. Basic site-level knowledge is usually enough."],["How fast can agencies get painters?","Typically a shortlist within 48 hours, and painters on site within one to two weeks depending on paperwork."],["What if a painter is not a fit?","Our replacement guarantee covers the first week on Pay per placement and the first four weeks for Partners."],["Why is a London company placing painters in Switzerland?","Our recruiting, compliance and account teams sit in London, close to a European talent pool and with long experience in cross-border staffing. On the ground we work with licensed local partners."],["Can I work in several countries?","Yes — one profile covers all four countries. Many painters do a facade season in Switzerland and interior work in Germany or France in winter."]],
  bl_t:"Journal", bl_s:"Guides, wage insights and stories from the sites we work on.", read_more:"Read more", read_less:"Show less", min_read:"{n} min read",
  posts:[["Working as a painter in Switzerland: the 90-day rule explained","EU and EFTA painters can work in Switzerland for up to 90 days a year with a simple online notification. Here’s how it works.","The notification must be submitted before work starts, usually by the employer or agency. It covers short assignments; for longer stays you need a short-term (L) or residence (B) permit. Our compliance team prepares the notification with you and checks that pay meets local collective agreements.","Compliance"],["What collective agreements mean for painters’ pay","Switzerland, Germany, France and Italy all have trade agreements that set minimum pay for painters. What to know before you sign.","Minimum rates vary by country, region, qualification and experience. In Switzerland the painting and plastering trade has its own collective labour agreement; in Germany the painters’ trade has minimum wages per qualification level. We always check offers against the applicable agreement.","Pay"],["Facade season: planning your year from March to October","Facade work follows the weather. Smart painters plan an exterior season in the Alps and an interior winter in the city.","Our recruiters start booking facade crews for St. Gallen, Graubünden and Valais in January. Register early, tell us your availability, and we can line up a winter interior job in Munich, Lyon or Milan too.","Careers"],["Five things Swiss agencies check before hiring","References, photos of previous work, language level, certificates and punctuality. How to prepare each one.","Most agencies decide within a day. A tidy profile with three good photos of finished work, a reference phone number and your qualification certificate puts you at the top of the shortlist. We translate certificates for Pro members.","Tips"],["Cross-border work from Konstanz, Annecy and Como","Living near the border? Commuting daily to Kreuzlingen, Geneva or Lugano can be a great option.","Cross-border commuters need a G permit for regular work in Switzerland. Many of our painters live in Konstanz, Annecy, Mulhouse or Como and commute every day. We explain the tax and insurance basics during onboarding.","Cross-border"],["Lime, silicate and stucco: materials of Alpine renovation","Historic buildings in Graubünden, Ticino and Valais need breathable materials. A quick guide.","Lime plasters and silicate paints let old masonry breathe and are often required by heritage authorities. Painters with experience in these systems are in high demand — and are often paid above standard rates.","Craft"]],

  lg_t:"Legal & privacy", lg_sections:[["Imprint","BrushBridge Ltd · London, United Kingdom · Registered in England & Wales · Company number and registered address to be added before launch. Contact: hello@brushbridge.example"],["Privacy","We process the data you submit (profile, applications, messages) only to match painters with jobs and to meet legal obligations. We never sell personal data. You can request access, correction or deletion at any time. Data is processed in line with the UK GDPR and the EU GDPR; Swiss clients are additionally covered by the Swiss FADP."],["Terms","BrushBridge acts as an intermediary between painters and agencies or contractors. Assignments in Switzerland are carried out with licensed local partners where required by law. Rates and conditions are agreed in writing for each assignment."],["Cookies","This site uses only essential storage for your language, theme and saved jobs unless you accept optional cookies. You can change your choice at any time below."]], lg_reset:"Reset cookie choice",

  ab_t:"Über BrushBridge", ab_s:"Ein kleines Londoner Team mit Farbe unter den Fingernägeln.",
  ab_story_t:"Unsere Geschichte",
  ab_story:["BrushBridge entstand 2019, als unsere Gründerin – früher Bauleiterin bei Hotelrenovationen in der Schweiz – immer wieder dasselbe Problem sah: Agenturen in Zürich und St. Gallen fanden keine Maler, während qualifizierte Maler in ganz Europa keine vertrauenswürdige Arbeit im Ausland fanden.","Also bauten wir eine Brücke. Von unserem Büro in London rekrutieren, prüfen und vermitteln wir Maler an Agenturen und Betriebe in der Schweiz, Deutschland, Frankreich und Italien – inklusive Verträgen, Meldungen und Lohnzahlung.","Heute arbeitet unser mehrsprachiges Team mit Hunderten Partnerfirmen – und jede Referenz rufen wir noch immer selbst an."],
  ab_val_t:"Wofür wir stehen",
  ab_vals:[["Fairer Lohn","Gesamtarbeitsverträge sind die Untergrenze, nie die Obergrenze."],["Klartext","Lohn, Termine und Konditionen schriftlich, bevor jemand anreist."],["Handwerk zuerst","Wir vermitteln Fachleute, keine Köpfe."],["Immer erreichbar","Ein echter Mensch antwortet – in Ihrer Sprache."]],

  team:[["Elena Marchetti","Mitgründerin & CEO"],["Jonas Keller","Leiter Vermittlung Schweiz"],["Camille Rousseau","Partnerschaften Frankreich & Romandie"],["Daniel Okafor","Compliance & Lohnbuchhaltung"],["Giulia Rossi","Recruiterin Italien & Tessin"],["Piotr Zieliński","Recruiter Deutschland & Ostschweiz"]],
  ab_office_t:"Besuchen Sie uns in London", city_london:"London, Vereinigtes Königreich",
  faq_t:"Häufige Fragen", faq_s:"Antwort nicht gefunden? Schreiben Sie uns – wir antworten innert eines Arbeitstages.", faq_search:"Fragen durchsuchen…",
  faqs:[["Ist BrushBridge für Maler kostenlos?","Ja. Der Basic-Plan ist dauerhaft kostenlos. Unsere Gebühr zahlt die Agentur bzw. der Betrieb, der Sie einsetzt. Pro ist optional."],["Brauche ich eine Schweizer Arbeitsbewilligung?","EU/EFTA-Bürger können in der Regel bis zu 90 Tage pro Kalenderjahr mit dem Online-Meldeverfahren in der Schweiz arbeiten; längere Einsätze brauchen eine Bewilligung. Wir erklären Ihre Optionen im Kennenlerngespräch."],["Wie und wann werde ich bezahlt?","Freigegebene Stunden werden jeden Freitag per Überweisung in CHF oder EUR bezahlt – je nach Einsatzland."],["Mit welchem Lohn kann ich rechnen?","Das hängt von Land, Kanton, Gewerk und Erfahrung ab. Jeder Job auf unserer Seite zeigt den Stundenlohn, und wir akzeptieren nie Angebote unter dem geltenden GAV."],["Helft ihr bei der Unterkunft?","Ja. Bei Einsätzen weg von zu Hause helfen wir mit der Unterkunft für die erste Woche und teilen bewährte Langzeitoptionen."],["Welche Sprachen brauche ich?","Deutsch für den Grossteil der Schweiz und Deutschland, Französisch für die Romandie und Frankreich, Italienisch für das Tessin und Italien. Baustellenkenntnisse reichen meist aus."],["Wie schnell bekommen Agenturen Maler?","In der Regel eine Shortlist innert 48 Stunden und Maler auf der Baustelle innert ein bis zwei Wochen, je nach Papieren."],["Was, wenn ein Maler nicht passt?","Unsere Ersatzgarantie deckt die erste Woche im Modell «Pro Vermittlung» und die ersten vier Wochen für Partner."],["Warum vermittelt eine Londoner Firma Maler in die Schweiz?","Recruiting, Compliance und Account Management sitzen in London – nahe an einem europäischen Talentpool und mit langer Erfahrung in grenzüberschreitender Personalvermittlung. Vor Ort arbeiten wir mit lizenzierten lokalen Partnern."],["Kann ich in mehreren Ländern arbeiten?","Ja – ein Profil gilt für alle vier Länder. Viele Maler machen eine Fassadensaison in der Schweiz und im Winter Innenarbeiten in Deutschland oder Frankreich."]],
  bl_t:"Magazin", bl_s:"Ratgeber, Lohninfos und Geschichten von unseren Baustellen.", read_more:"Weiterlesen", read_less:"Weniger anzeigen", min_read:"{n} Min. Lesezeit",
  posts:[["Als Maler in der Schweiz arbeiten: die 90-Tage-Regel erklärt","EU- und EFTA-Maler können mit einer einfachen Online-Meldung bis zu 90 Tage pro Jahr in der Schweiz arbeiten. So funktioniert’s.","Die Meldung muss vor Arbeitsbeginn erfolgen, meist durch den Arbeitgeber oder die Agentur. Sie gilt für kurze Einsätze; für längere Aufenthalte braucht es eine Kurzaufenthalts- (L) oder Aufenthaltsbewilligung (B). Unser Compliance-Team bereitet die Meldung mit Ihnen vor und prüft, ob der Lohn den lokalen GAV einhält.","Compliance"],["Was Gesamtarbeitsverträge für den Malerlohn bedeuten","Schweiz, Deutschland, Frankreich und Italien haben Branchenverträge mit Mindestlöhnen für Maler. Was Sie vor der Unterschrift wissen sollten.","Mindestlöhne variieren nach Land, Region, Qualifikation und Erfahrung. In der Schweiz hat das Maler- und Gipsergewerbe einen eigenen GAV; in Deutschland gibt es im Malerhandwerk Mindestlöhne nach Qualifikationsstufe. Wir prüfen jedes Angebot gegen den geltenden Vertrag.","Lohn"],["Fassadensaison: das Jahr von März bis Oktober planen","Fassadenarbeit folgt dem Wetter. Clevere Maler planen eine Aussensaison in den Alpen und einen Innenwinter in der Stadt.","Unsere Recruiter buchen Fassadenequipen für St. Gallen, Graubünden und das Wallis ab Januar. Registrieren Sie sich früh und nennen Sie Ihre Verfügbarkeit – dann organisieren wir auch einen Winterjob in München, Lyon oder Mailand.","Karriere"],["Fünf Dinge, die Schweizer Agenturen vor der Einstellung prüfen","Referenzen, Arbeitsfotos, Sprachniveau, Zertifikate und Pünktlichkeit. So bereiten Sie sich vor.","Die meisten Agenturen entscheiden innert eines Tages. Ein sauberes Profil mit drei guten Fotos fertiger Arbeiten, einer Referenznummer und Ihrem Fähigkeitszeugnis bringt Sie an die Spitze der Shortlist. Für Pro-Mitglieder übersetzen wir Zertifikate.","Tipps"],["Grenzgänger aus Konstanz, Annecy und Como","Wohnen Sie nahe der Grenze? Tägliches Pendeln nach Kreuzlingen, Genf oder Lugano kann eine gute Option sein.","Grenzgänger brauchen für regelmässige Arbeit in der Schweiz eine Grenzgängerbewilligung (G). Viele unserer Maler wohnen in Konstanz, Annecy, Mulhouse oder Como und pendeln täglich. Die Grundlagen zu Steuern und Versicherung erklären wir beim Onboarding.","Grenzgänger"],["Kalk, Silikat und Stuck: Materialien der alpinen Renovation","Historische Bauten in Graubünden, im Tessin und im Wallis brauchen diffusionsoffene Materialien. Ein kurzer Leitfaden.","Kalkputze und Silikatfarben lassen altes Mauerwerk atmen und werden von der Denkmalpflege oft verlangt. Maler mit Erfahrung in diesen Systemen sind sehr gefragt – und werden oft über dem Standardlohn bezahlt.","Handwerk"]],

  lg_t:"Rechtliches & Datenschutz", lg_sections:[["Impressum","BrushBridge Ltd · London, Vereinigtes Königreich · Eingetragen in England & Wales · Handelsregisternummer und Geschäftsadresse werden vor dem Launch ergänzt. Kontakt: hello@brushbridge.example"],["Datenschutz","Wir verarbeiten die von Ihnen übermittelten Daten (Profil, Bewerbungen, Nachrichten) ausschliesslich, um Maler und Jobs zusammenzubringen und gesetzliche Pflichten zu erfüllen. Wir verkaufen nie personenbezogene Daten. Sie können jederzeit Auskunft, Berichtigung oder Löschung verlangen. Die Verarbeitung erfolgt gemäss UK-DSGVO und EU-DSGVO; für Schweizer Kunden gilt zusätzlich das revDSG."],["AGB","BrushBridge vermittelt zwischen Malern und Agenturen bzw. Betrieben. Einsätze in der Schweiz erfolgen, wo gesetzlich erforderlich, mit lizenzierten lokalen Partnern. Lohn und Konditionen werden pro Einsatz schriftlich vereinbart."],["Cookies","Diese Website nutzt nur notwendigen Speicher für Sprache, Design und gemerkte Jobs, es sei denn, Sie akzeptieren optionale Cookies. Ihre Wahl können Sie unten jederzeit ändern."]], lg_reset:"Cookie-Auswahl zurücksetzen",

  ab_t:"À propos de BrushBridge", ab_s:"Une petite équipe londonienne avec de la peinture sous les ongles.",
  ab_story_t:"Notre histoire",
  ab_story:["BrushBridge est née en 2019 lorsque notre fondatrice — ancienne conductrice de travaux sur des rénovations d’hôtels en Suisse — constatait toujours le même problème : les agences de Zurich et Saint-Gall ne trouvaient pas de peintres, tandis que des peintres qualifiés partout en Europe ne trouvaient pas de travail fiable à l’étranger.","Nous avons donc construit un pont. Depuis Londres, nous recrutons, évaluons et plaçons des peintres auprès d’agences et d’entreprises en Suisse, en Allemagne, en France et en Italie, en gérant contrats, annonces et paie.","Aujourd’hui, notre équipe multilingue travaille avec des centaines d’entreprises partenaires — et nous appelons toujours chaque référence nous-mêmes."],
  ab_val_t:"Nos valeurs",
  ab_vals:[["Salaire juste","Les conventions collectives sont un plancher, jamais un plafond."],["Parler vrai","Tarifs, dates et conditions par écrit avant tout départ."],["Le métier d’abord","Nous plaçons des artisans, pas des effectifs."],["Toujours joignables","Une vraie personne répond — dans votre langue."]],
  ab_team_t:"L’équipe",
  team:[["Elena Marchetti","Cofondatrice & CEO"],["Jonas Keller","Responsable placements Suisse"],["Camille Rousseau","Partenariats France & Romandie"],["Daniel Okafor","Conformité & paie"],["Giulia Rossi","Recruteuse Italie & Tessin"],["Piotr Zieliński","Recruteur Allemagne & Suisse orientale"]],
  ab_office_t:"Rendez-nous visite à Londres", city_london:"Londres, Royaume-Uni",
  faq_t:"Questions fréquentes", faq_s:"Pas de réponse ? Écrivez-nous — nous répondons sous un jour ouvré.", faq_search:"Rechercher une question…",
  faqs:[["BrushBridge est-il gratuit pour les peintres ?","Oui. L’offre Basic est gratuite pour toujours. Nos frais sont payés par l’agence ou l’entreprise qui vous engage. Pro est facultatif."],["Ai-je besoin d’un permis de travail suisse ?","Les citoyens UE/AELE peuvent généralement travailler en Suisse jusqu’à 90 jours par année civile grâce à la procédure d’annonce en ligne ; au-delà, un permis est nécessaire. Nous vous expliquons vos options lors de l’entretien."],["Comment et quand suis-je payé ?","Les heures validées sont payées chaque vendredi par virement en CHF ou EUR, selon le pays de la mission."],["Quels tarifs puis-je attendre ?","Cela dépend du pays, du canton, du métier et de l’expérience. Chaque offre affiche le tarif horaire, et nous n’acceptons jamais d’offre sous la convention collective applicable."],["Aidez-vous pour le logement ?","Oui. Pour les missions loin de chez vous, nous vous aidons à trouver un logement pour la première semaine et partageons des solutions longue durée fiables."],["Quelles langues dois-je parler ?","L’allemand pour la majeure partie de la Suisse et l’Allemagne, le français pour la Romandie et la France, l’italien pour le Tessin et l’Italie. Un niveau chantier suffit généralement."],["En combien de temps une agence obtient-elle des peintres ?","En général une sélection sous 48 heures et des peintres sur le chantier en une à deux semaines selon les formalités."],["Et si un peintre ne convient pas ?","Notre garantie de remplacement couvre la première semaine avec l’offre Au placement et les quatre premières semaines pour les Partenaires."],["Pourquoi une société londonienne place-t-elle des peintres en Suisse ?","Nos équipes recrutement, conformité et comptes sont à Londres, proches d’un vivier européen et fortes d’une longue expérience du placement transfrontalier. Sur place, nous travaillons avec des partenaires locaux agréés."],["Puis-je travailler dans plusieurs pays ?","Oui — un seul profil couvre les quatre pays. Beaucoup de peintres font une saison de façades en Suisse et des travaux intérieurs en Allemagne ou en France l’hiver."]],
  bl_t:"Journal", bl_s:"Guides, salaires et récits de nos chantiers.", read_more:"Lire la suite", read_less:"Réduire", min_read:"{n} min de lecture",
  posts:[["Travailler comme peintre en Suisse : la règle des 90 jours expliquée","Les peintres UE et AELE peuvent travailler en Suisse jusqu’à 90 jours par an grâce à une simple annonce en ligne. Mode d’emploi.","L’annonce doit être faite avant le début du travail, généralement par l’employeur ou l’agence. Elle couvre les missions courtes ; pour un séjour plus long, il faut une autorisation de courte durée (L) ou de séjour (B). Notre équipe conformité prépare l’annonce avec vous et vérifie que le salaire respecte les conventions locales.","Conformité"],["Ce que les conventions collectives signifient pour votre salaire","La Suisse, l’Allemagne, la France et l’Italie ont des accords de branche fixant un salaire minimum pour les peintres. À savoir avant de signer.","Les minima varient selon le pays, la région, la qualification et l’expérience. En Suisse, la peinture et la plâtrerie ont leur propre convention collective ; en Allemagne, le métier de peintre a des salaires minimaux par niveau de qualification. Nous vérifions chaque offre par rapport à la convention applicable.","Salaire"],["Saison des façades : planifier son année de mars à octobre","Le travail de façade suit la météo. Les peintres malins prévoient une saison extérieure dans les Alpes et un hiver intérieur en ville.","Nos recruteurs réservent les équipes de façade pour Saint-Gall, les Grisons et le Valais dès janvier. Inscrivez-vous tôt, indiquez vos disponibilités, et nous pouvons aussi vous trouver une mission d’hiver à Munich, Lyon ou Milan.","Carrière"],["Cinq points que les agences suisses vérifient avant d’embaucher","Références, photos de réalisations, niveau de langue, diplômes et ponctualité. Comment préparer chacun.","La plupart des agences décident en une journée. Un profil soigné avec trois belles photos de chantiers terminés, un numéro de référence et votre diplôme vous place en tête de la sélection. Nous traduisons les diplômes pour les membres Pro.","Conseils"],["Frontaliers : travailler depuis Constance, Annecy ou Côme","Vous habitez près de la frontière ? Faire la navette vers Kreuzlingen, Genève ou Lugano peut être une excellente option.","Les frontaliers ont besoin d’un permis G pour travailler régulièrement en Suisse. Beaucoup de nos peintres vivent à Constance, Annecy, Mulhouse ou Côme et font la navette chaque jour. Nous expliquons les bases fiscales et d’assurance lors de l’intégration.","Frontaliers"],["Chaux, silicate et stuc : les matériaux de la rénovation alpine","Les bâtiments historiques des Grisons, du Tessin et du Valais demandent des matériaux respirants. Petit guide.","Les enduits à la chaux et les peintures aux silicates laissent respirer la maçonnerie ancienne et sont souvent exigés par les services du patrimoine. Les peintres qui maîtrisent ces systèmes sont très recherchés — et souvent mieux payés.","Savoir-faire"]],

  lg_t:"Mentions légales & confidentialité", lg_sections:[["Mentions légales","BrushBridge Ltd · Londres, Royaume-Uni · Immatriculée en Angleterre et au Pays de Galles · Numéro d’entreprise et adresse du siège à compléter avant la mise en ligne. Contact : hello@brushbridge.example"],["Confidentialité","Nous traitons les données que vous transmettez (profil, candidatures, messages) uniquement pour mettre en relation peintres et missions et pour respecter nos obligations légales. Nous ne vendons jamais de données personnelles. Vous pouvez demander l’accès, la rectification ou la suppression à tout moment. Traitement conforme au RGPD britannique et européen ; la LPD suisse s’applique en plus pour les clients suisses."],["Conditions","BrushBridge agit comme intermédiaire entre peintres et agences ou entreprises. En Suisse, les missions sont réalisées avec des partenaires locaux agréés lorsque la loi l’exige. Tarifs et conditions sont convenus par écrit pour chaque mission."],["Cookies","Ce site utilise uniquement un stockage essentiel pour la langue, le thème et les offres sauvegardées, sauf si vous acceptez les cookies optionnels. Vous pouvez modifier votre choix ci-dessous."]], lg_reset:"Réinitialiser le choix des cookies",

  ab_t:"Chi è BrushBridge", ab_s:"Un piccolo team londinese con la pittura sotto le unghie.",
  ab_story_t:"La nostra storia",
  ab_story:["BrushBridge nasce nel 2019, quando la nostra fondatrice — ex capocantiere nelle ristrutturazioni di hotel in Svizzera — vedeva sempre lo stesso problema: le agenzie di Zurigo e San Gallo non trovavano pittori, mentre pittori qualificati in tutta Europa non trovavano lavoro affidabile all’estero.","Così abbiamo costruito un ponte. Dal nostro ufficio di Londra selezioniamo, valutiamo e collochiamo pittori presso agenzie e imprese in Svizzera, Germania, Francia e Italia, gestendo contratti, notifiche e paghe.","Oggi il nostro team multilingue lavora con centinaia di aziende partner — e chiamiamo ancora personalmente ogni referenza."],
  ab_val_t:"In cosa crediamo",
  ab_vals:[["Paga giusta","I contratti collettivi sono il minimo, mai il massimo."],["Parlare chiaro","Paga, date e condizioni per iscritto prima di partire."],["Prima il mestiere","Collochiamo artigiani, non numeri."],["Sempre raggiungibili","Risponde una persona vera — nella tua lingua."]],
  ab_team_t:"Il team",
  team:[["Elena Marchetti","Cofondatrice & CEO"],["Jonas Keller","Responsabile collocamenti Svizzera"],["Camille Rousseau","Partnership Francia & Romandia"],["Daniel Okafor","Compliance & paghe"],["Giulia Rossi","Recruiter Italia & Ticino"],["Piotr Zieliński","Recruiter Germania & Svizzera orientale"]],
  ab_office_t:"Vieni a trovarci a Londra", city_london:"Londra, Regno Unito",
  faq_t:"Domande frequenti", faq_s:"Non trovi la risposta? Scrivici — rispondiamo entro un giorno lavorativo.", faq_search:"Cerca tra le domande…",
  faqs:[["BrushBridge è gratuito per i pittori?","Sì. Il piano Basic è gratuito per sempre. La nostra commissione è pagata dall’agenzia o impresa che ti assume. Pro è facoltativo."],["Mi serve un permesso di lavoro svizzero?","I cittadini UE/AELS possono di norma lavorare in Svizzera fino a 90 giorni per anno civile con la procedura di notifica online; per incarichi più lunghi serve un permesso. Ti spieghiamo le opzioni durante il colloquio."],["Come e quando vengo pagato?","Le ore approvate vengono pagate ogni venerdì con bonifico in CHF o EUR, a seconda del paese dell’incarico."],["Che paga posso aspettarmi?","Dipende da paese, cantone, mestiere ed esperienza. Ogni offerta mostra la tariffa oraria e non accettiamo mai offerte sotto il contratto collettivo applicabile."],["Aiutate con l’alloggio?","Sì. Per gli incarichi lontano da casa ti aiutiamo a trovare un alloggio per la prima settimana e condividiamo soluzioni affidabili a lungo termine."],["Quali lingue servono?","Il tedesco per gran parte della Svizzera e la Germania, il francese per la Romandia e la Francia, l’italiano per il Ticino e l’Italia. Di solito basta un livello da cantiere."],["Quanto velocemente un’agenzia riceve pittori?","Di solito una rosa di candidati entro 48 ore e pittori in cantiere entro una o due settimane, a seconda delle pratiche."],["E se un pittore non è adatto?","La garanzia di sostituzione copre la prima settimana con A collocamento e le prime quattro settimane per i Partner."],["Perché un’azienda londinese colloca pittori in Svizzera?","I nostri team di selezione, compliance e account sono a Londra, vicini a un bacino di talenti europeo e con lunga esperienza nel collocamento transfrontaliero. Sul posto lavoriamo con partner locali autorizzati."],["Posso lavorare in più paesi?","Sì — un solo profilo vale per tutti e quattro i paesi. Molti pittori fanno una stagione di facciate in Svizzera e lavori d’interni in Germania o Francia d’inverno."]],
  bl_t:"Journal", bl_s:"Guide, paghe e storie dai nostri cantieri.", read_more:"Leggi tutto", read_less:"Mostra meno", min_read:"{n} min di lettura",
  posts:[["Lavorare come pittore in Svizzera: la regola dei 90 giorni","I pittori UE e AELS possono lavorare in Svizzera fino a 90 giorni l’anno con una semplice notifica online. Ecco come funziona.","La notifica va fatta prima dell’inizio dei lavori, di solito dal datore di lavoro o dall’agenzia. Vale per incarichi brevi; per soggiorni più lunghi serve un permesso di breve durata (L) o di dimora (B). Il nostro team compliance prepara la notifica con te e verifica che la paga rispetti i contratti collettivi locali.","Compliance"],["Cosa significano i contratti collettivi per la paga dei pittori","Svizzera, Germania, Francia e Italia hanno accordi di settore con salari minimi per i pittori. Cosa sapere prima di firmare.","I minimi variano per paese, regione, qualifica ed esperienza. In Svizzera il settore pittura e gessatura ha un proprio contratto collettivo; in Germania il mestiere di pittore prevede minimi per livello di qualifica. Verifichiamo ogni offerta rispetto al contratto applicabile.","Paga"],["Stagione delle facciate: pianificare l’anno da marzo a ottobre","Il lavoro sulle facciate segue il meteo. I pittori più furbi pianificano una stagione all’aperto sulle Alpi e un inverno al chiuso in città.","I nostri recruiter prenotano le squadre per facciate a San Gallo, nei Grigioni e in Vallese già da gennaio. Registrati presto, indica la tua disponibilità e possiamo trovarti anche un lavoro invernale a Monaco, Lione o Milano.","Carriera"],["Cinque cose che le agenzie svizzere controllano prima di assumere","Referenze, foto dei lavori, livello di lingua, attestati e puntualità. Come prepararli.","La maggior parte delle agenzie decide in un giorno. Un profilo curato con tre belle foto di lavori finiti, un numero di referenza e il tuo attestato ti mette in cima alla lista. Per i membri Pro traduciamo gli attestati.","Consigli"],["Frontalieri: lavorare da Costanza, Annecy e Como","Vivi vicino al confine? Fare il pendolare verso Kreuzlingen, Ginevra o Lugano può essere un’ottima scelta.","I frontalieri hanno bisogno di un permesso G per lavorare regolarmente in Svizzera. Molti dei nostri pittori vivono a Costanza, Annecy, Mulhouse o Como e fanno i pendolari ogni giorno. Spieghiamo le basi su tasse e assicurazioni durante l’onboarding.","Frontalieri"],["Calce, silicati e stucco: i materiali del restauro alpino","Gli edifici storici di Grigioni, Ticino e Vallese richiedono materiali traspiranti. Una breve guida.","Gli intonaci a calce e le pitture ai silicati lasciano respirare la muratura antica e sono spesso richiesti dalla tutela dei monumenti. I pittori esperti in questi sistemi sono molto richiesti — e spesso pagati più della media.","Mestiere"]],

let UID = 0;
function field(name, label, o = {}) {
  const id = "f" + (++UID), req = o.req !== false;
  const star = req ? ' <span class="req" aria-hidden="true">*</span>' : "";
  let ctrl;
  if (o.type === "select") ctrl = `<select class="input" id="${id}" name="${name}" ${req ? "required" : ""}>${o.ph !== undefined ? `<option value="">${esc(o.ph)}</option>` : ""}${o.opts.map(([v, l]) => `<option value="${esc(v)}" ${String(o.val) === String(v) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  else if (o.type === "textarea") ctrl = `<textarea class="input" id="${id}" name="${name}" rows="${o.rows || 4}" ${req ? "required" : ""} placeholder="${esc(o.ph || "")}">${esc(o.val || "")}</textarea>`;
  else ctrl = `<input class="input" id="${id}" name="${name}" type="${o.type || "text"}" ${req ? "required" : ""} ${o.attrs || ""} placeholder="${esc(o.ph || "")}" ${o.val !== undefined ? `value="${esc(o.val)}"` : ""}>`;
  return `<div class="field ${o.full ? "full" : ""}"><label for="${id}">${label}${star}</label>${ctrl}<small class="err" aria-live="polite"></small></div>`;
}
const checkField = (name, label, req = false) => { const id = "f" + (++UID); return `<div class="field full"><label class="checkbox" for="${id}"><input type="checkbox" id="${id}" name="${name}" ${req ? "required" : ""}><span>${label}</span></label><small class="err" aria-live="polite"></small></div>`; };
const groupField = (name, label, items, req = true) => `<div class="field full" data-group="${req ? "req" : "opt"}" role="group" aria-label="${esc(label)}"><span class="label">${label}${req ? ' <span class="req" aria-hidden="true">*</span>' : ""}</span><div class="pills">${items.map(([v, l]) => `<label class="pill"><input type="checkbox" name="${name}" value="${esc(v)}"><span>${esc(l)}</span></label>`).join("")}</div><small class="err" aria-live="polite"></small></div>`;
function validate(scope) {
  let ok = true, first = null;
  $$(".field", scope).forEach(fd => {
    if (fd.closest("fieldset[hidden]")) return;
    const err = $(".err", fd); let msg = "";
    if (fd.dataset.group) {
      if (fd.dataset.group === "req" && !$$("input:checked", fd).length) msg = t("err_pick");
    } else {
      const inp = $("input,select,textarea", fd); if (!inp || inp.type === "file") return;
      const v = inp.type === "checkbox" ? inp.checked : inp.value.trim();
      if (inp.required && !v) msg = inp.type === "checkbox" ? t("err_consent") : t("err_req");
      else if (inp.type === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) msg = t("err_email");
      inp.setAttribute("aria-invalid", msg ? "true" : "false");
    }
    if (err) err.textContent = msg;
    fd.classList.toggle("invalid", !!msg);
    if (msg) { ok = false; first = first || fd; }
  });
  if (first) { const f = $("input,select,textarea", first); if (f) f.focus(); }
  return ok;
}

  </form></div></section>`; };
INIT.post = () => { const f = $("form[data-form=post]"), cs = f.elements.country, ci = f.elements.city; cs.addEventListener("change", () => { ci.innerHTML = `<option value="">—</option>` + CITIES.filter(c => c.country === cs.value).sort((a, b) => cityName(a).localeCompare(cityName(b), LOCALE())).map(c => `<option value="${c.id}">${esc(cityName(c))}${c.country === "CH" ? " (" + c.region + ")" : ""}</option>`).join(""); }); };

/* ---------- Legal / Saved / 404 ---------- */
PAGES.legal = () => `${pageHero(t("lg_t"), "", "plasterwall")}
  <section class="sec"><div class="wrap narrow">
    <div class="utabs">${t("lg_sections").map(([h], i) => `<button data-jump="lg${i}">${h}</button>`).join("")}</div>
    ${t("lg_sections").map(([h, p], i) => `<section id="lg${i}" style="padding:1.5rem 0;border-bottom:1px solid var(--line)"><h2>${h}</h2><p class="muted">${p}</p>${i === 3 ? `<button class="btn btn-o btn-sm" data-cookie-reset>${t("lg_reset")}</button>` : ""}</section>`).join("")}
  </div></section>`;
INIT.legal = () => $$("[data-jump]").forEach(a => a.addEventListener("click", () => $("#" + a.dataset.jump).scrollIntoView({ behavior: "smooth" })));
PAGES.saved = () => { const list = savedIds().map(jobById).filter(Boolean); return `${pageHero(t("sv_t"), t("sv_s"), "wall")}
  <section class="sec-s"><div class="wrap">${list.length ? jobList(list) : `<div class="empty"><p>${t("sv_empty")}</p><a class="btn" href="#/jobs">${t("cta_jobs")}</a></div>`}</div></section>`; };
PAGES.notfound = () => `<section class="phero nf"><div class="phero-in">${pic("wall", "", "phero-img", 2000, true)}<div class="phero-txt"><div class="wrap"><h1>${t("nf_big")}</h1><a class="btn" href="#/">${t("go_home")}</a></div></div></div></section>`;

/* =========================================================
   Forms
   ========================================================= */
const push = (k, v) => { const a = store.get(k, []); a.unshift(v); store.set(k, a.slice(0, 200)); };
const successHtml = (title, text, extra = "") => `<div class="success"><span class="ok">${icon("check")}</span><h2 style="font-size:1.5rem">${title}</h2>${text ? `<p class="muted">${text}</p>` : ""}${extra}</div>`;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const FORMS = {
  finder(f) { const q = f.elements.q.value.trim(); location.hash = "#/jobs" + (q ? "?q=" + encodeURIComponent(q) : ""); },
  apply(f) {
    if (!validate(f)) return;
    const fd = new FormData(f), ref = refCode("AP");
    push("applications", { ref, job: f.dataset.job, name: fd.get("name"), email: fd.get("email"), phone: fd.get("phone"), years: fd.get("years"), msg: fd.get("msg"), ts: Date.now() });
    f.closest(".modal").innerHTML = `<button class="modal-x" data-close aria-label="${t("close")}">${icon("x")}</button>` + successHtml(t("ap_ok_t"), t("ap_ok", { name: esc(fd.get("name")), ref: `<b>${ref}</b>` }), `<button class="btn" data-close>${t("ok")}</button>`);
  },
  contact(f) { if (!validate(f)) return; push("messages", Object.fromEntries(new FormData(f))); f.outerHTML = successHtml(t("ct_ok"), "", `<a class="btn btn-o" href="#/">${t("go_home")}</a>`); },
  register(f) {
    if (!validate($('fieldset[data-step="3"]', f))) return;
    const fd = new FormData(f), ref = refCode("BBP"), obj = {};
    for (const [k, v] of fd.entries()) obj[k] = k in obj ? [].concat(obj[k], v) : v;
    push("profiles", { ...obj, ref, ts: Date.now() });
    f.innerHTML = successHtml(t("rg_ok_t"), t("rg_ok", { ref: `<b>${ref}</b>` }), `<a class="btn" href="#/jobs">${t("cta_jobs")}</a>`);
    f.scrollIntoView({ behavior: "smooth" });
  },
  post(f) {
    if (!validate(f)) return;
    const fd = new FormData(f), c = CITY[fd.get("city")], id = "BB-U" + Math.random().toString(36).slice(2, 6).toUpperCase();
    push("jobs", { id, city: c.id, type: fd.get("type"), contract: fd.get("contract"), rate: +fd.get("rate"), cur: c.country === "CH" ? "CHF" : "EUR", weeks: fd.get("contract") === "perm" ? 0 : +(fd.get("weeks") || 4), posted: 0, startISO: fd.get("start"), painters: +fd.get("painters") || 1, urgent: !!fd.get("urgent"), housing: !!fd.get("housing"), langs: c.langs.slice(), client: fd.get("company"), desc: fd.get("desc"), user: true });
    f.outerHTML = `<div class="form-card">${successHtml(t("pj_ok_t"), t("pj_ok", { ref: `<b>${id}</b>` }), `<div class="btn-row" style="justify-content:center"><a class="btn" href="#/job/${id}">${t("pj_view")}</a><a class="btn btn-o" href="#/jobs">${t("view_all")}</a></div>`)}</div>`;
  },
  review(f) {
    if (!validate(f)) return;
    const fd = new FormData(f);
    push("reviews", { id: "u" + Date.now(), n: fd.get("name"), ro: fd.get("role"), c: fd.get("city"), s: +fd.get("stars"), tx: fd.get("text"), d: 0, ts: Date.now() });
    f.reset(); RV.filter = 0; refreshReviews(); toast(t("rv_ok"));
  },
  news(f) { const i = $("input", f); if (!EMAIL_RE.test(i.value.trim())) { i.focus(); toast(t("err_email")); return; } push("subscribers", i.value.trim()); f.reset(); toast(t("ft_news_ok")); },
  alert(f) { FORMS.news(f); }
};

/* =========================================================
   Chrome: header, mega menu, footer, side tabs, modal, cookie
   ========================================================= */
const GROUPS = [
  { id: "p", label: "nav_painters", links: ["jobs", "register", "painters", "how", "saved"], img: "wall", teaser: ["p_s", "register", "nav_register"] },
  { id: "a", label: "nav_agencies", links: ["agencies", "post", "pricing", "services"], img: "ladder", teaser: ["a_s", "post", "a_cta"] },
  { id: "l", label: "nav_locations", links: ["locations?c=CH", "locations?c=DE", "locations?c=FR", "locations?c=IT"], img: "zurich", teaser: ["home_ct_s", "locations", "nav_locations"] },
  { id: "c", label: "ft_comp", links: ["about", "testimonials", "reviews", "blog", "faq", "contact"], img: "london", teaser: ["ft_about", "about", "nav_about"] }
];
const linkLabel = p => p.startsWith("locations?c=") ? t("country_" + p.slice(-2)) : t("nav_" + p);
const groupOf = page => (GROUPS.find(g => g.links.some(l => l.split("?")[0] === page)) || {}).id;
let MEGA = null;
function megaHtml(g, page) {
  return `<div class="wrap mega-grid"><h3>${t(g.label)}</h3><div class="mega-links">${g.links.map(p => `<a href="#/${p}" ${page === p.split("?")[0] && !p.includes("?") ? 'aria-current="page"' : ""}>${linkLabel(p)}${LA}</a>`).join("")}</div>
    <a class="teaser" href="#/${g.teaser[1]}">${pic(g.img, "", "", 700)}<span class="muted" style="font-size:.98rem">${t(g.teaser[0])}</span><span class="more">${t(g.teaser[2])}${LA}</span></a></div>`;
}
function renderHeader(page) {
  const cg = groupOf(page), n = savedIds().length;
  $("#header").innerHTML = `<div class="wrap hd-in">
    <a class="logo" href="#/" aria-label="BrushBridge — ${t("nav_home")}"><span>brush</span><span>bridge</span></a>
    <nav class="mainnav" aria-label="Main"><ul>${GROUPS.map(g => `<li><button class="nb ${cg === g.id ? "cur" : ""}" data-mega="${g.id}" aria-expanded="${MEGA === g.id}" aria-controls="mega">${t(g.label)}</button></li>`).join("")}</ul></nav>
    <div class="util">
      <a class="u" href="#/jobs">${icon("search")}<span class="u-txt">${t("search_btn")}</span></a>
      <div class="langsel" id="langsel"><button class="u" data-langmenu aria-haspopup="true" aria-expanded="false" aria-label="${t("lang")}">${lang.toUpperCase()} ${icon("chev")}</button><ul>${[["de", "Deutsch"], ["fr", "Français"], ["it", "Italiano"], ["en", "English"]].map(([l, n]) => `<li><button data-lang="${l}" lang="${l}" aria-current="${l === lang}">${n}</button></li>`).join("")}</ul></div>
      <a class="u" href="#/register">${icon("users")}<span class="u-txt">${t("nav_register")}</span></a>
      <a class="u" href="#/saved" aria-label="${t("nav_saved")}">${icon("heart")}${n ? `<span class="badge">${n}</span>` : ""}</a>
      <button class="u burger" data-burger aria-label="${t("menu")}" aria-expanded="false" aria-controls="drawer">${icon("menu")}</button>
    </div></div>
    <div class="mega" id="mega" ${MEGA ? "" : "hidden"}>${MEGA ? megaHtml(GROUPS.find(g => g.id === MEGA), page) : ""}</div>
    <div class="drawer" id="drawer" hidden><div class="wrap">
      ${GROUPS.map(g => `<h3>${t(g.label)}</h3>${g.links.map(p => `<a class="dl" href="#/${p}">${linkLabel(p)}${LA}</a>`).join("")}`).join("")}
      <h3>${t("nav_legal")}</h3><a class="dl" href="#/legal">${t("nav_legal")}${LA}</a>
      <div class="dlang">${["de", "fr", "it", "en"].map(l => `<button data-lang="${l}" aria-current="${l === lang}">${l.toUpperCase()}</button>`).join("")}</div>
    </div></div>`;
}
function setMega(id) {
  MEGA = id; const m = $("#mega"); if (!m) return;
  $$("[data-mega]").forEach(b => b.setAttribute("aria-expanded", String(b.dataset.mega === id)));
  if (!id) { m.hidden = true; m.innerHTML = ""; return; }
  m.innerHTML = megaHtml(GROUPS.find(g => g.id === id), route().page); m.hidden = false;
}
function renderFooter() {
  const L = p => `<li><a href="#/${p}">${t("nav_" + p)}</a></li>`;
  $("#footer").innerHTML = `<div class="ft"><div class="wrap ft-in">
      <div class="ft-brand">${wordmark("w")}<div><b>BrushBridge Ltd<br>${t("ft_about").split(".")[0]}.</b>${t("city_london")}<br>Tel. <a href="tel:+442079460321">+44 20 7946 0321</a><br><a href="mailto:hello@brushbridge.example">hello@brushbridge.example</a></div></div>
      <div><h4>${t("ft_work")}</h4><ul>${["jobs", "register", "locations", "painters", "agencies", "post"].map(L).join("")}</ul></div>
      <div><h4>${t("follow")}</h4><div class="social"><a href="#/contact" aria-label="LinkedIn">${soc("linkedin")}</a><a href="#/contact" aria-label="Instagram">${soc("instagram")}</a><a href="#/contact" aria-label="Facebook">${soc("facebook")}</a></div><ul>${["about", "blog", "reviews", "faq", "contact"].map(L).join("")}</ul></div>
      <div class="ft-news"><p>${t("ft_alert_t")}</p><form data-form="news" novalidate><label class="sr-only" for="news-email">${t("ft_news_ph")}</label><input id="news-email" type="email" placeholder="${t("ft_news_ph")}"><button>${t("subscribe")}</button></form></div>
    </div></div>
    <div class="ftb"><div class="wrap ftb-in"><nav aria-label="${t("lang")}">${["de", "fr", "it", "en"].map(l => `<button data-lang="${l}" aria-current="${l === lang}">${l.toUpperCase()}</button>`).join("")}<span class="sep">|</span><a href="#/legal">${t("lg_sections")[0][0]}</a><span class="sep">|</span><a href="#/legal">${t("lg_sections")[1][0]}</a><span class="sep">|</span><a href="#/legal">${t("lg_sections")[2][0]}</a></nav><span class="muted">© ${TODAY.getFullYear()} BrushBridge Ltd · ${t("ft_reg")} · ${t("photos")}</span></div></div>`;
  $("#side").innerHTML = `<a class="st b" href="#/jobs">${icon("search")}${t("side_find")}</a><a class="st" href="#/post">${icon("users")}${t("cta_hire")}</a>`;
}
let lastFocus = null;
function openModal(html) {
  lastFocus = document.activeElement;
  $("#modal-root").innerHTML = `<div class="modal-bg" data-backdrop><div class="modal" role="dialog" aria-modal="true"><button class="modal-x" data-close aria-label="${t("close")}">${icon("x")}</button>${html}</div></div>`;
  document.body.classList.add("lock");
  const f = $("#modal-root input, #modal-root select"); if (f) f.focus();
}
function closeModal() { if (!$("#modal-root").innerHTML) return; $("#modal-root").innerHTML = ""; document.body.classList.remove("lock"); if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); }
function toast(msg) { const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; $("#toast").appendChild(el); setTimeout(() => el.remove(), 3200); }
function renderCookie() {
  const root = $("#cookie-root");
  if (store.get("cookie", null)) { root.innerHTML = ""; return; }
  root.innerHTML = `<div class="cookie-bg"></div><div class="cookie" role="dialog" aria-modal="true" aria-labelledby="ck-t"><h2 id="ck-t">${t("ck_t")}</h2><p>${t("ck_text")} <a href="#/legal">${t("nav_legal")}</a></p><div class="btn-row"><button class="btn" data-cookie="all">${t("ck_all")}</button><button class="btn btn-o" data-cookie="essential">${t("ck_ess")}</button></div></div>`;
}

/* =========================================================
   Router & render
   ========================================================= */
function route() {
  const raw = location.hash.replace(/^#\/?/, ""), [path, qs] = raw.split("?"), parts = path.split("/").filter(Boolean);
  return { page: parts[0] || "home", param: parts[1] ? decodeURIComponent(parts[1]) : null, query: Object.fromEntries(new URLSearchParams(qs || "")) };
}
function countUp() {
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; const el = e.target, end = +el.dataset.count, t0 = performance.now(); const step = now => { const p = Math.min(1, (now - t0) / 1200); el.textContent = num(Math.round(end * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); io.unobserve(el); }), { threshold: .4 });
  $$("[data-count]").forEach(e => io.observe(e));
}
function render() {
  const r = route(), page = PAGES[r.page] && r.page !== "notfound" ? r.page : "notfound";
  document.documentElement.lang = lang;
  $("#skip").textContent = t("skip");
  closeModal(); MEGA = null; document.body.classList.remove("lock");
  $("#app").innerHTML = PAGES[page](r.param, r.query);
  renderHeader(page); renderFooter(); renderCookie();
  const ttl = { home: () => t("meta_title"), city: () => t("city_t", { city: cityName(CITY[r.param]) }) + " · BrushBridge", job: () => { const j = jobById(r.param); return jobTitle(j) + " — " + cityName(CITY[j.city]) + " · BrushBridge"; }, notfound: () => "404 · BrushBridge" };
  document.title = ttl[page] ? ttl[page]() : t("nav_" + page) + " · BrushBridge";
  if (INIT[page]) INIT[page](r.param, r.query);
  countUp();
  window.scrollTo(0, 0);
  $("#app").focus({ preventScroll: true });
}

/* =========================================================
   Global events
   ========================================================= */
document.addEventListener("click", e => {
  const el = e.target;
  const lb = el.closest("[data-lang]"); if (lb) { lang = lb.dataset.lang; store.set("lang", lang); render(); return; }
  const lm = el.closest("[data-langmenu]"); if (lm) { const ls = $("#langsel"); ls.classList.toggle("open"); lm.setAttribute("aria-expanded", String(ls.classList.contains("open"))); return; }
  if (!el.closest("#langsel") && $("#langsel")) $("#langsel").classList.remove("open");
  const mb = el.closest("[data-mega]"); if (mb) { setMega(MEGA === mb.dataset.mega ? null : mb.dataset.mega); return; }
  if (MEGA && !el.closest("#mega")) setMega(null);
  if (MEGA && el.closest("#mega a")) setMega(null);
  const bur = el.closest("[data-burger]");
  if (bur) { const d = $("#drawer"); d.hidden = !d.hidden; bur.setAttribute("aria-expanded", String(!d.hidden)); document.body.classList.toggle("lock", !d.hidden); return; }
  if (el.closest("#drawer a")) document.body.classList.remove("lock");
  const sv = el.closest("[data-save]");
  if (sv) {
    e.preventDefault(); const id = sv.dataset.save; let s = savedIds(); const on = !s.includes(id);
    s = on ? [id, ...s] : s.filter(x => x !== id); store.set("saved", s);
    $$(`[data-save="${id}"]`).forEach(b => { b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); if (b.classList.contains("save")) b.setAttribute("aria-label", t(on ? "saved" : "save")); const l = $("[data-save-label]", b); if (l) l.textContent = t(on ? "saved" : "save"); });
    const hb = $("#header a[href='#/saved']"); if (hb) hb.innerHTML = icon("heart") + (s.length ? `<span class="badge">${s.length}</span>` : "");
    toast(t(on ? "saved" : "save") + (on ? " ♥" : " ✕"));
    if (route().page === "saved" && !on) render();
    return;
  }
  const ap = el.closest("[data-apply]"); if (ap) { openApply(ap.dataset.apply); return; }
  if (el.closest("[data-close]") || el.matches("[data-backdrop]")) { closeModal(); return; }
  if (el.closest("[data-copy]")) { const u = location.href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast(t("link_copied")), () => toast(u)); return; }
  const ck = el.closest("[data-cookie]"); if (ck) { store.set("cookie", ck.dataset.cookie); renderCookie(); return; }
  if (el.closest("[data-cookie-reset]")) { store.del("cookie"); renderCookie(); }
});
document.addEventListener("submit", e => { const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault(); const h = FORMS[f.dataset.form]; if (h) h(f); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); setMega(null); const d = $("#drawer"); if (d && !d.hidden) { d.hidden = true; document.body.classList.remove("lock"); } if ($("#langsel")) $("#langsel").classList.remove("open"); }
  if (e.key === "Tab" && $("#modal-root .modal")) { const els = $$("#modal-root button, #modal-root input, #modal-root select, #modal-root textarea, #modal-root a[href]").filter(x => !x.disabled); if (!els.length) return; const a = els[0], z = els[els.length - 1]; if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); } }
});
window.addEventListener("scroll", () => { const h = $("#header"); if (h) h.classList.toggle("scrolled", scrollY > 8); }, { passive: true });
window.addEventListener("hashchange", render);
render();
})();

</script>
